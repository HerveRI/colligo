[project]
name = "colligo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths= ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "retrieval: slow tests requiring a seeded database",
]
